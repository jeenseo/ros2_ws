# nav2_params.yaml
# ================
# ROS 2 Nav2 파라미터 — 자율 장애물 회피 로봇
#
# 로봇 특성:
#   구동: 스키드-스티어 (비홀로노믹, 전/후진+회전)
#   LiDAR: RPLIDAR A1  /scan  (frame: lidar_link)
#   오도메트리: rf2o_laser_odometry (스캔 매칭, 엔코더 없음)
#   맵: maps/map.yaml (사전 빌드된 정적 맵)
#
# 비대칭 Footprint (base_link = LiDAR 위치 기준, 단위 m):
#   전방: +0.265 m,  좌측: +0.370 m
#   우측: -0.375 m,  후방: -0.570 m
#
# TF 트리: map → odom → base_footprint → base_link → lidar_link
#
# 수정 이력:
#   - global_costmap.global_frame: odom → map
#   - robot_base_frame: base_link → base_footprint (전체)
#   - amcl 섹션 추가
#   - collision_monitor 제거 (파라미터 없음 → lifecycle abort 방지)
#   - global_costmap rolling_window 제거, static_layer 활성화
#   - 관측 소스 frame: lidar_link

# ─────────────────────────────────────────────────────────────────────────
# AMCL (Monte Carlo Localization — 맵 기반 위치 추정)
# ─────────────────────────────────────────────────────────────────────────
amcl:
  ros__parameters:
    use_sim_time:         false
    alpha1:               0.2
    alpha2:               0.2
    alpha3:               0.2
    alpha4:               0.2
    alpha5:               0.2
    base_frame_id:        "base_footprint"
    beam_skip_distance:   0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold:  0.3
    do_beamskip:          false
    global_frame_id:      "map"
    lambda_short:         0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range:      100.0
    laser_min_range:      -1.0
    laser_model_type:     "likelihood_field"
    max_beams:            60
    max_particles:        1000
    min_particles:        500
    odom_frame_id:        "odom"
    pf_err:               0.05
    pf_z:                 0.99
    recovery_alpha_fast:  0.0
    recovery_alpha_slow:  0.0
    resample_interval:    1
    robot_model_type:     "nav2_amcl::DifferentialMotionModel"
    save_pose_rate:       0.5
    sigma_hit:            0.2
    tf_broadcast:         true
    transform_tolerance:  1.0
    update_min_a:         0.5
    update_min_d:         0.5
    z_hit:                0.5
    z_max:                0.05
    z_rand:               0.5
    z_short:              0.05
    scan_topic:           "/scan"
    map_topic:            "map"
    set_initial_pose:     true
    initial_pose:
      x:     0.0
      y:     0.0
      z:     0.0
      yaw:   0.0

# ─────────────────────────────────────────────────────────────────────────
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # [추가 방어막] 에러 코드 누락 경고를 없애줍니다.
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

# ─────────────────────────────────────────────────────────────────────────
controller_server:
  ros__parameters:
    use_sim_time:                 false
    # [수정] 5Hz → 10Hz: 낮은 주파수가 경로 추종 지연 및 진동의 주 원인
    controller_frequency:         5.0
    min_x_velocity_threshold:     0.001
    min_y_velocity_threshold:     0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance:            0.3
    progress_checker_plugin:      "progress_checker"
    goal_checker_plugins:         ["general_goal_checker"]
    controller_plugins:           ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance:  5.0

    general_goal_checker:
      stateful:        True
      plugin:          "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance:  0.3
      yaw_goal_tolerance: 0.5

    FollowPath:
      plugin:                              "dwb_core::DWBLocalPlanner"
      debug_trajectory_details:            True
      min_vel_x:                           0.20
      min_vel_y:                           0.0
      max_vel_x:                           0.40
      max_vel_y:                           0.0
      # [수정] 0.4 → 0.8: 더 빠른 회전 허용 → 경로 추종 능력 향상
      # [수정] 서빙 로봇 스타일 회전/속도 최적화
      max_vel_theta:                       0.4
      # [최종 수정] min_speed_xy: 물리 최소 속도(DEADBAND≈0.195 m/s)에 맞춤
      # DWB가 0.15 m/s 이상만 샘플링 → STM32 미속 스톨/지터 완전 차단
      # Nav2 계획 속도 ≥ 실제 최소 속도 → 5초 재계획 지연 해소
      min_speed_xy:                        0.20   # 0.07 → 0.15: 물리 최소값 일치
      max_speed_xy:                        0.40
      min_speed_theta:                     0.1
      # acc_lim_x 강화: 0→0.15 m/s 도달을 빠르게 → 출발 딜레이 최소화
      acc_lim_x:                           0.30   # 0.15 → 0.30: 빠른 최소속도 도달
      acc_lim_y:                           0.0
      acc_lim_theta:                       0.3
      # decel_lim_x 강화: 장애물 앞 깔끔한 급정지 허용
      decel_lim_x:                         -0.40  # -0.25 → -0.40: 강한 제동
      decel_lim_y:                         0.0
      decel_lim_theta:                     -0.3
      vx_samples:                          10
      vy_samples:                          0 # 꽃게 걸음 0 높이면 꽃게 걸음 가능
      vtheta_samples:                      10
      sim_time:                            1.5
      linear_granularity:                  0.05
      angular_granularity:                 0.025
      transform_tolerance:                 1.0
      xy_goal_tolerance:                   0.3
      # [수정] trans_stopped_velocity: min_speed_xy 아래로 여유를 두어 명확한 경계 설정
      # 0.10 < v < 0.15: 도달 불가 구간 → DWB는 0 또는 ≥0.15만 선택
      trans_stopped_velocity:              0.20   # 0.05 → 0.10
      short_circuit_trajectory_evaluation: True
      stateful:                            True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist"]
      # [수정] 서빙 로봇 DWB 크리틱 최적화
      # BaseObstacle: 70.0은 과도 (장애물 근처에서 경로 난기류 유발)
      # → 표준 범위(0.02~5.0)로 정상화. 대신 inflation_radius로 안전거리 확보.
      BaseObstacle.scale:              0.1    # 70.0 → 0.1: 정상화 (극단값 제거)
      PathAlign.scale:                 32.0
      PathAlign.forward_point_distance: 0.8
      # GoalAlign: 5.0 → 16.0: 목표 지점 정렬 강화 (상차 정확도 향상)
      GoalAlign.scale:                 16.0   # 5.0 → 16.0
      GoalAlign.forward_point_distance: 0.8
      # PathDist: 10.0 → 32.0: 경로 이탈 방지 강화
      PathDist.scale:                  32.0   # 10.0 → 32.0
      GoalDist.scale:                  32.0
      # [수정] 32.0 → 24.0: 목표 근처 과도한 회전 감소
      RotateToGoal.scale:              24.0
      # [수정] 5.0 → 3.0: 목표 접근 시 과도한 감속 완화
      RotateToGoal.slowing_factor:     3.0
      RotateToGoal.lookahead_time:     -1.0

# ─────────────────────────────────────────────────────────────────────────
local_costmap: # $로봇 주변의 동적 장애물 감지 및 회피를 위한 로컬 코스트맵
  local_costmap:
    ros__parameters:
      use_sim_time:       false
      update_frequency:   5.0
      # 🚨 [수정 완료] 폭스글로브(화면)로 쏘는 주기를 1Hz로 낮춰 CPU와 Wi-Fi 대역폭 방어!
      publish_frequency:  1.0  
      global_frame:       odom
      robot_base_frame:   base_footprint
      transform_tolerance: 1.0 # 추가됨
      rolling_window:     true
      width:              3
      height:             3
      resolution:         0.1
      # ── 정확한 로봇 footprint (물리 실측 기반, padding 없음) ──────
      footprint: "[[0.25, 0.28], [0.25, -0.28], [-0.25, -0.28], [-0.25, 0.28]]"
      footprint_padding: 0.0     # 정확한 물리 경계 (패딩 없음)
      plugins: ["obstacle_layer", "inflation_layer"]
      
      inflation_layer:
        plugin:              "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius:    0.45
        
      obstacle_layer:
        plugin:               "nav2_costmap_2d::ObstacleLayer"
        enabled:              True
        observation_sources:  scan
        # footprint_clearing 활성화: 로봇 몸통 내부에 찍히는 가짜 장애물(라이다 노이즈 등)을 지워줍니다.
        footprint_clearing_enabled: True 
        scan:
          topic:               /scan
          sensor_frame:        lidar_link
          # 2D 평면에서 z축(높이)은 필요 없으므로 완전히 0으로 깔아뭉갭니다.
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing:            True
          marking:             True
          data_type:           "LaserScan"
          raytrace_max_range:  3.0
          raytrace_min_range:  0.0
          # 🚨 [수정 완료] 맵 크기(3m)를 벗어나는 외곽 에러 방지를 위해 2.5m로 축소!
          obstacle_max_range:  2.5 
          obstacle_min_range:  0.0
      
      # [유지] 바뀐 부분만 전송하여 네트워크 부하 최적화
      always_send_full_costmap: True

# ─────────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────────
global_costmap: # 전역 코스트맵: 사전 빌드된 정적 맵 사용
  global_costmap:
    ros__parameters:
      use_sim_time:        false
      
      # ⚠️ [참고] 0.1은 '10초에 1번' 갱신/전송한다는 뜻입니다. 
      # 폭스글로브에서 맵이 뜰 때까지 최대 10초가 걸릴 수 있습니다!
      update_frequency:    0.1
      publish_frequency:   0.1
      
      global_frame:        map           # ← odom에서 map으로 변경
      robot_base_frame:    base_footprint
      transform_tolerance: 1.0           # 추가됨
      
      # 🚨 [수정 완료] resolution 중복 제거 (기존 맵 파일에 맞게 0.05로 통일)
      resolution:          0.05
      
      # ── 정확한 로봇 footprint (local_costmap과 동일 기준) ─────────
      footprint: "[[0.25, 0.28], [0.25, -0.28], [-0.25, -0.28], [-0.25, 0.28]]"
      footprint_padding:   0.0
      
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      
      static_layer:
        plugin:    "nav2_costmap_2d::StaticLayer"
        enabled:   True
        map_subscribe_transient_local: True
        
      obstacle_layer:
        plugin:              "nav2_costmap_2d::ObstacleLayer"
        enabled:             True
        observation_sources: scan
        scan:
          topic:               /scan
          sensor_frame:        lidar_link
          max_obstacle_height: 2.0
          clearing:            True
          marking:             True
          data_type:           "LaserScan"
          raytrace_max_range:  3.0
          raytrace_min_range:  0.0
          obstacle_max_range:  2.5
          obstacle_min_range:  0.0
          
      # 🚨 [복구 완료] 플러그인에 선언해둔 inflation_layer 설정 복구
      inflation_layer:
        plugin:              "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius:    0.45
        
      always_send_full_costmap: False

# ─────────────────────────────────────────────────────────────────────────
map_server:
  ros__parameters:
    use_sim_time:  false
    yaml_filename: "/mnt/c/Users/tjwld/ros2_ws/src/robot_controller/maps/map.yaml"   # launch 파일에서 주입

map_saver:
  ros__parameters:
    use_sim_time:              false
    save_map_timeout:          5.0
    free_thresh_default:       0.25
    occupied_thresh_default:   0.65
    map_subscribe_transient_local: True

# ─────────────────────────────────────────────────────────────────────────
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time:               false
    planner_plugins:            ["GridBased"]
    GridBased:
      plugin:        "nav2_navfn_planner::NavfnPlanner"
      tolerance:     0.5
      use_astar:     false
      allow_unknown: true

# ─────────────────────────────────────────────────────────────────────────
smoother_server:
  ros__parameters:
    use_sim_time:     false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin:         "nav2_smoother::SimpleSmoother"
      tolerance:      1.0e-10
      max_its:        1000
      do_refinement:  True

# ─────────────────────────────────────────────────────────────────────────
behavior_server:
  ros__parameters:
    costmap_topic:    local_costmap/costmap_raw
    footprint_topic:  local_costmap/published_footprint
    cycle_frequency:  10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame:           odom
    robot_base_frame:       base_footprint
    transform_tolerance:    1.0
    use_sim_time:           false
    simulate_ahead_time:    2.0
    # [수정] DWB max_vel_theta(0.4), acc_lim_theta(0.3)에 맞춰 동기화
    max_rotational_vel:     0.4
    min_rotational_vel:     0.1
    rotational_acc_lim:     0.3

# ─────────────────────────────────────────────────────────────────────────
waypoint_follower:
  ros__parameters:
    use_sim_time:            false
    loop_rate:               20
    stop_on_failure:         false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin:                 "nav2_waypoint_follower::WaitAtWaypoint"
      enabled:                True
      waypoint_pause_duration: 200

# ─────────────────────────────────────────────────────────────────────────
velocity_smoother:
  ros__parameters:
    use_sim_time:         false
    smoothing_frequency:  20.0
    scale_velocities:     False
    feedback:             "OPEN_LOOP"
    # [수정] DWB 파라미터와 완전 동기화 (velocity_smoother != controller_server 시 surge 발생)
    max_velocity:         [0.22, 0.0, 0.4]
    min_velocity:         [-0.22, 0.0, -0.4]
    max_accel:            [0.30, 0.0, 0.3]
    max_decel:            [-0.40, 0.0, -0.3]
    odom_topic:           "odom"
    odom_duration:        0.1
    deadband_velocity:    [0.0, 0.0, 0.0]
    velocity_timeout:     1.0

# ─────────────────────────────────────────────────────────────────────────
# collision_monitor (ROS 2 Jazzy Nav2에서 기본 포함)
# ─────────────────────────────────────────────────────────────────────────
# Jazzy의 navigation_launch.py lifecycle_nodes 목록에 collision_monitor가
# 추가됨. 파라미터가 없으면 lifecycle_manager가 configure 단계에서 Abort.
# → 기능을 비활성화하되 파라미터 섹션은 반드시 존재해야 함.
# ─────────────────────────────────────────────────────────────────────────
# ★ Jazzy Nav2 Lifecycle Manager Abort 방지용 파라미터 (수정완료) ★
# --- 여기서부터 복사 ---
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 1.0 # tf 변환 허용 오차 시간 원래 0.2
    source_timeout: 5.0
    stop_pub_timeout: 2.0
    polygons: ["dummy_box"]
    dummy_box:
      type: "polygon"
      # [핵심 트릭] 파서가 만족하는 완벽한 2D 배열 문자열 형식!
      # 가로/세로 1cm짜리 초소형 박스라서 평생 장애물에 부딪힐 일이 없습니다.
      points: "[[0.01, 0.01], [0.01, -0.01], [-0.01, -0.01], [-0.01, 0.01]]"
      action_type: "stop"
      min_points: 4
      visualize: false
      polygon_pub_topic: "polygon_stop"
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      
docking_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 50.0
    dock_plugins: ['simple_dock']
    simple_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.5
      staging_yaw_offset: 0.0