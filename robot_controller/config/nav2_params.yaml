# nav2_params.yaml
# ================
# ROS 2 Nav2 파라미터 — 자율 장애물 회피 로봇
#
# 로봇 특성:
#   구동: 스키드-스티어 (비홀로노믹, 전/후진+회전)
#   LiDAR: RPLIDAR A1  /scan  (frame: lidar_link)
#   오도메트리: rf2o_laser_odometry (스캔 매칭, 엔코더 없음)
#   맵: maps/map.yaml (사전 빌드된 정적 맵)
#
# 비대칭 Footprint (base_link = LiDAR 위치 기준, 단위 m):
#   전방: +0.265 m,  좌측: +0.370 m
#   우측: -0.375 m,  후방: -0.570 m
#
# TF 트리: map → odom → base_footprint → base_link → lidar_link
#
# 수정 이력:
#   - global_costmap.global_frame: odom → map
#   - robot_base_frame: base_link → base_footprint (전체)
#   - amcl 섹션 추가
#   - collision_monitor 제거 (파라미터 없음 → lifecycle abort 방지)
#   - global_costmap rolling_window 제거, static_layer 활성화
#   - 관측 소스 frame: lidar_link

# ─────────────────────────────────────────────────────────────────────────
# AMCL (Monte Carlo Localization — 맵 기반 위치 추정)
# ─────────────────────────────────────────────────────────────────────────
amcl:
  ros__parameters:
    use_sim_time:         false
    alpha1:               0.2
    alpha2:               0.2
    alpha3:               0.2
    alpha4:               0.2
    alpha5:               0.2
    base_frame_id:        "base_footprint"
    beam_skip_distance:   0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold:  0.3
    do_beamskip:          false
    global_frame_id:      "map"
    lambda_short:         0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range:      100.0
    laser_min_range:      -1.0
    laser_model_type:     "likelihood_field"
    max_beams:            60
    max_particles:        1000
    min_particles:        500
    odom_frame_id:        "odom"
    pf_err:               0.05
    pf_z:                 0.99
    recovery_alpha_fast:  0.0
    recovery_alpha_slow:  0.0
    resample_interval:    1
    robot_model_type:     "nav2_amcl::DifferentialMotionModel"
    save_pose_rate:       0.5
    sigma_hit:            0.2
    tf_broadcast:         true
    transform_tolerance:  1.0
    update_min_a:         0.5
    update_min_d:         0.5
    z_hit:                0.5
    z_max:                0.05
    z_rand:               0.5
    z_short:              0.05
    scan_topic:           "/scan"
    map_topic:            "map"
    set_initial_pose:     true
    initial_pose:
      x:     0.0
      y:     0.0
      z:     0.0
      yaw:   0.0

# ─────────────────────────────────────────────────────────────────────────
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

# ─────────────────────────────────────────────────────────────────────────
controller_server:
  ros__parameters:
    use_sim_time:                 false
    controller_frequency:         5.0
    min_x_velocity_threshold:     0.001
    min_y_velocity_threshold:     0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance:            0.3
    progress_checker_plugin:      "progress_checker"
    goal_checker_plugins:         ["general_goal_checker"]
    controller_plugins:           ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance:  5.0

    general_goal_checker:
      stateful:        True
      plugin:          "nav2_controller::SimpleGoalChecker"
      # 🚀 [신의 한 수] 관성 안착 (Latch) 세팅 적용
      xy_goal_tolerance:  0.15           # 0.3 -> 0.15 (골프 홀컵 15cm 반경)
      yaw_goal_tolerance: 0.10           # 0.5 -> 0.10 (회전 허용치 넉넉하게)
      latch_xy_goal_tolerance: true      # 반경 진입 시 즉시 모터 끄고 관성으로 스르륵 안착!

    FollowPath:
      plugin:                              "dwb_core::DWBLocalPlanner"
      debug_trajectory_details:            True
      # [최종] 2단계 피드포워드 + 미속 제어 허용
      min_vel_x:                           0.0    # DWB 정지 허용 (0.0 필수)
      min_vel_y:                           0.0
      max_vel_x:                           0.22
      max_vel_y:                           0.0
      max_vel_theta:                       0.4
      # min_speed_xy=0.05: 2단계 피드포워드로 0.05 m/s(≈8 RPM) 스티션 없이 구동 가능
      min_speed_xy:                        0.05   # 0.20 → 0.05: 미속 제어 허용
      max_speed_xy:                        0.22
      min_speed_theta:                     0.1
      # 부드러운 가감속 (서빙 로봇 자연스러운 주행)
      acc_lim_x:                           0.30   # 1.0 → 0.30: 부드러운 가속
      acc_lim_y:                           0.0
      acc_lim_theta:                       0.4
      decel_lim_x:                         -0.50  # -1.0 → -0.50: 적절한 감속
      decel_lim_y:                         0.0
      decel_lim_theta:                     -0.4
      
      vx_samples:                          10
      vy_samples:                          0
      vtheta_samples:                      10
      sim_time:                            1.5
      linear_granularity:                  0.05
      angular_granularity:                 0.025
      transform_tolerance:                 1.0
      xy_goal_tolerance:                   0.3
      
      # trans_stopped_velocity: min_speed_xy 아래로 명확한 경계 (0.03 < 0.05)
      trans_stopped_velocity:              0.03   # 0.15 → 0.03
      
      short_circuit_trajectory_evaluation: True
      stateful:                            True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist"]
      # [수정] 장애물 회피 우선순위 강화: 0.1 → 0.5
      # 장애물 근처에서 경로보다 회피를 우선시 → 충돌 방지
      BaseObstacle.scale:              40.0    # 0.1 → 0.5
      PathAlign.scale:                 32.0
      PathAlign.forward_point_distance: 0.8
      GoalAlign.scale:                 16.0
      GoalAlign.forward_point_distance: 0.8
      PathDist.scale:                  32.0
      GoalDist.scale:                  32.0
      RotateToGoal.scale:              24.0
      RotateToGoal.slowing_factor:     3.0
      RotateToGoal.lookahead_time:     -1.0

# ─────────────────────────────────────────────────────────────────────────
local_costmap: 
  local_costmap:
    ros__parameters:
      use_sim_time:       false
      update_frequency:   5.0
      publish_frequency:  5.0  
      global_frame:       odom
      robot_base_frame:   base_footprint
      transform_tolerance: 1.0 
      rolling_window:     true
      width:              3
      height:             3
      resolution:         0.1
      footprint: "[[0.25, 0.28], [0.25, -0.28], [-0.25, -0.28], [-0.25, 0.28]]"
      footprint_padding: 0.0     
      plugins: ["obstacle_layer", "inflation_layer"]
      
      inflation_layer:
        plugin:              "nav2_costmap_2d::InflationLayer"
        # [수정] 장애물 조기 감지: radius 0.45→0.55, scaling 5.0→2.5 (완만한 비용 감쇠)
        cost_scaling_factor: 2.5
        inflation_radius:    0.55
        
      obstacle_layer:
        plugin:               "nav2_costmap_2d::ObstacleLayer"
        enabled:              True
        observation_sources:  scan
        footprint_clearing_enabled: True 
        scan:
          topic:               /scan
          sensor_frame:        lidar_link
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing:            True
          marking:             True
          data_type:           "LaserScan"
          raytrace_max_range:  3.0
          raytrace_min_range:  0.0
          obstacle_max_range:  2.5 
          obstacle_min_range:  0.0
      
      always_send_full_costmap: True

# ─────────────────────────────────────────────────────────────────────────
global_costmap: 
  global_costmap:
    ros__parameters:
      use_sim_time:        false
      update_frequency:    0.1
      publish_frequency:   0.1
      
      global_frame:        map           
      robot_base_frame:    base_footprint
      transform_tolerance: 1.0           
      
      resolution:          0.05
      
      footprint: "[[0.25, 0.28], [0.25, -0.28], [-0.25, -0.28], [-0.25, 0.28]]"
      footprint_padding:   0.0
      
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      
      static_layer:
        plugin:    "nav2_costmap_2d::StaticLayer"
        enabled:   True
        map_subscribe_transient_local: True
        
      obstacle_layer:
        plugin:              "nav2_costmap_2d::ObstacleLayer"
        enabled:             True
        observation_sources: scan
        scan:
          topic:               /scan
          sensor_frame:        lidar_link
          max_obstacle_height: 2.0
          clearing:            True
          marking:             True
          data_type:           "LaserScan"
          raytrace_max_range:  3.0
          raytrace_min_range:  0.0
          obstacle_max_range:  2.5
          obstacle_min_range:  0.0
          
      inflation_layer:
        plugin:              "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius:    0.45
        
      always_send_full_costmap: False

# ─────────────────────────────────────────────────────────────────────────
map_server:
  ros__parameters:
    use_sim_time:  false
    yaml_filename: "/mnt/c/Users/tjwld/ros2_ws/src/robot_controller/maps/map.yaml"

map_saver:
  ros__parameters:
    use_sim_time:              false
    save_map_timeout:          5.0
    free_thresh_default:       0.25
    occupied_thresh_default:   0.65
    map_subscribe_transient_local: True

# ─────────────────────────────────────────────────────────────────────────
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time:               false
    planner_plugins:            ["GridBased"]
    GridBased:
      plugin:        "nav2_navfn_planner::NavfnPlanner"
      tolerance:     0.5
      use_astar:     false
      allow_unknown: true

# ─────────────────────────────────────────────────────────────────────────
smoother_server:
  ros__parameters:
    use_sim_time:     false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin:         "nav2_smoother::SimpleSmoother"
      tolerance:      1.0e-10
      max_its:        1000
      do_refinement:  True

# ─────────────────────────────────────────────────────────────────────────
behavior_server:
  ros__parameters:
    costmap_topic:    local_costmap/costmap_raw
    footprint_topic:  local_costmap/published_footprint
    cycle_frequency:  10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame:           odom
    robot_base_frame:       base_footprint
    transform_tolerance:    1.0
    use_sim_time:           false
    simulate_ahead_time:    2.0
    max_rotational_vel:     0.4
    min_rotational_vel:     0.1
    rotational_acc_lim:     0.3

# ─────────────────────────────────────────────────────────────────────────
waypoint_follower:
  ros__parameters:
    use_sim_time:            false
    loop_rate:               20
    stop_on_failure:         false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin:                 "nav2_waypoint_follower::WaitAtWaypoint"
      enabled:                True
      waypoint_pause_duration: 200

# ─────────────────────────────────────────────────────────────────────────
velocity_smoother:
  ros__parameters:
    use_sim_time:         false
    smoothing_frequency:  20.0
    scale_velocities:     False
    feedback:             "OPEN_LOOP"
    # 🚀 [수정 완료] DWB의 가감속 제한과 동일하게 맞춰서 스무더가 방해하지 못하게 함
    max_velocity:         [0.22, 0.0, 0.4]
    min_velocity:         [-0.22, 0.0, -0.4]
    max_accel:            [0.30, 0.0, 0.4]
    max_decel:            [-0.50, 0.0, -0.4]
    odom_topic:           "odom"
    odom_duration:        0.1
    deadband_velocity:    [0.0, 0.0, 0.0]
    velocity_timeout:     1.0

# ─────────────────────────────────────────────────────────────────────────
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 1.0 
    source_timeout: 5.0
    stop_pub_timeout: 2.0
    polygons: ["dummy_box"]
    dummy_box:
      type: "polygon"
      points: "[[0.01, 0.01], [0.01, -0.01], [-0.01, -0.01], [-0.01, 0.01]]"
      action_type: "stop"
      min_points: 4
      visualize: false
      polygon_pub_topic: "polygon_stop"
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      
docking_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 50.0
    dock_plugins: ['simple_dock']
    simple_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.5
      staging_yaw_offset: 0.0