# nav2_params.yaml
# ================
# ROS 2 Nav2 파라미터 — 자율 장애물 회피 로봇
#
# 로봇 특성:
#   구동: 메카넘 (Omni, 전방위 이동)
#   LiDAR: RPLIDAR A1  /scan  (frame: lidar_link)
#   오도메트리: rf2o_laser_odometry (스캔 매칭, 엔코더 없음)
#   맵: maps/map.yaml (사전 빌드된 정적 맵)
#
# TF 트리: map → odom → base_footprint → base_link → lidar_link

amcl:
  ros__parameters:
    use_sim_time:         false
    alpha1:               0.2
    alpha2:               0.2
    alpha3:               0.2
    alpha4:               0.2
    alpha5:               0.2
    base_frame_id:        "base_footprint"
    beam_skip_distance:   0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold:  0.3
    do_beamskip:          false
    global_frame_id:      "map"
    lambda_short:         0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range:      100.0
    laser_min_range:      -1.0
    laser_model_type:     "likelihood_field"
    max_beams:            60
    max_particles:        2000
    min_particles:        500
    odom_frame_id:        "odom"
    pf_err:               0.05
    pf_z:                 0.99
    recovery_alpha_fast:  0.0
    recovery_alpha_slow:  0.0
    resample_interval:    1
    robot_model_type:     "nav2_amcl::DifferentialMotionModel"
    save_pose_rate:       0.5
    sigma_hit:            0.2
    tf_broadcast:         true
    transform_tolerance:  1.0
    update_min_a:         0.5
    update_min_d:         0.5
    z_hit:                0.5
    z_max:                0.05
    z_rand:               0.5
    z_short:              0.05
    scan_topic:           "/scan"
    map_topic:            "map"
    set_initial_pose:     true
    initial_pose:
      x:     0.0
      y:     0.0
      z:     0.0
      yaw:   0.0

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time:                 false
    controller_frequency:         20.0
    min_x_velocity_threshold:     0.001
    min_y_velocity_threshold:     0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance:            0.3
    progress_checker_plugin:      "progress_checker"
    goal_checker_plugins:         ["general_goal_checker"]
    controller_plugins:           ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance:  5.0

    general_goal_checker:
      stateful:        True
      plugin:          "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance:  0.15           
      yaw_goal_tolerance: 0.10           
      latch_xy_goal_tolerance: true      

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 60       
      model_dt: 0.05       
      batch_size:      2000     
      iteration_count: 1
      temperature:     0.3      
      gamma:           0.015

      vx_max: 0.30
      vx_min: -0.30        
      vy_max: 0.20         
      vy_min: -0.20        
      wz_max: 0.50 
      
      vx_std: 0.20         
      vy_std: 0.40         
      wz_std: 0.20
      
      motion_model: "Omni" 

      critics: ["ObstaclesCritic", "PathFollowCritic", "PathAngleCritic", "GoalCritic", "GoalAngleCritic", "PreferForwardCritic", "TwirlingCritic"]
      
      ObstaclesCritic:
        plugin: "mppi::ObstaclesCritic"
        critical_weight:  200.0
        repulsion_weight: 2.0
        critical_distance: 0.55
        collision_cost:   100000.0
        near_goal_distance: 0.5
        robot_radius: 0.38

      PathFollowCritic:
        plugin: "mppi::PathFollowCritic"
        offset_from_furthest: 8
        max_path_ratio:  0.2

      PathAngleCritic:
        plugin: "mppi::PathAngleCritic"
        offset_from_furthest: 4
        threshold_to_consider: 0.40
        max_angle_to_furthest: 1.0

      GoalCritic:
        plugin: "mppi::GoalCritic"
        threshold_to_consider: 1.4

      GoalAngleCritic:
        plugin: "mppi::GoalAngleCritic"
        threshold_to_consider: 0.40

      PreferForwardCritic:
        plugin: "mppi::PreferForwardCritic"
        penalty_weight: 0.2

      TwirlingCritic:
        plugin: "mppi::TwirlingCritic"
        twirling_cost_weight: 10.0

local_costmap: 
  local_costmap:
    ros__parameters:
      use_sim_time:       false
      update_frequency:   10.0
      publish_frequency:  10.0  
      global_frame:       odom
      robot_base_frame:   base_footprint
      transform_tolerance: 1.0 
      rolling_window:     true
      width:              5
      height:             5
      resolution:         0.1 
      footprint: "[[0.25, 0.28], [0.25, -0.28], [-0.25, -0.28], [-0.25, 0.28]]"
      footprint_padding: 0.0     
      plugins: ["obstacle_layer", "inflation_layer"]
      
      inflation_layer:
        plugin:              "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius:    0.80
        
      obstacle_layer:
        plugin:               "nav2_costmap_2d::ObstacleLayer"
        enabled:              True
        observation_sources:  scan
        footprint_clearing_enabled: True 
        scan:
          topic:               /scan
          sensor_frame:        lidar_link
          inf_is_valid:        True
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing:            True
          marking:             True
          data_type:           "LaserScan"
          raytrace_max_range:  10.0
          raytrace_min_range:  0.0
          obstacle_max_range:  2.5 
          obstacle_min_range:  0.10
      
      always_send_full_costmap: True

global_costmap: 
  global_costmap:
    ros__parameters:
      use_sim_time:        false
      update_frequency:    0.1
      publish_frequency:   0.1
      global_frame:        map           
      robot_base_frame:    base_footprint
      transform_tolerance: 1.0           
      resolution:          0.05
      footprint: "[[0.25, 0.28], [0.25, -0.28], [-0.25, -0.28], [-0.25, 0.28]]"
      footprint_padding:   0.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      
      static_layer:
        plugin:    "nav2_costmap_2d::StaticLayer"
        enabled:   True
        map_subscribe_transient_local: True
        
      obstacle_layer:
        plugin:              "nav2_costmap_2d::ObstacleLayer"
        enabled:             True
        observation_sources: scan
        scan:
          topic:               /scan
          sensor_frame:        lidar_link
          inf_is_valid:        True
          max_obstacle_height: 2.0
          clearing:            True
          marking:             True
          data_type:           "LaserScan"
          raytrace_max_range:  10.0
          raytrace_min_range:  0.0
          obstacle_max_range:  2.5
          obstacle_min_range:  0.0
          
      inflation_layer:
        plugin:              "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius:    0.45
      always_send_full_costmap: False

map_server:
  ros__parameters:
    use_sim_time:  false
    yaml_filename: "/mnt/c/Users/tjwld/ros2_ws/src/robot_controller/maps/map.yaml"

map_saver:
  ros__parameters:
    use_sim_time:              false
    save_map_timeout:          5.0
    free_thresh_default:       0.25
    occupied_thresh_default:   0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time:               false
    planner_plugins:            ["GridBased"]
    GridBased:
      plugin:        "nav2_navfn_planner::NavfnPlanner"
      tolerance:     0.5
      use_astar:     false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time:     false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin:         "nav2_smoother::SimpleSmoother"
      tolerance:      1.0e-10
      max_its:        1000
      do_refinement:  True

behavior_server:
  ros__parameters:
    costmap_topic:    local_costmap/costmap_raw
    footprint_topic:  local_costmap/published_footprint
    cycle_frequency:  10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame:           odom
    robot_base_frame:       base_footprint
    transform_tolerance:    1.0
    use_sim_time:           false
    simulate_ahead_time:    2.0
    max_rotational_vel:     0.4
    min_rotational_vel:     0.1
    rotational_acc_lim:     0.3

waypoint_follower:
  ros__parameters:
    use_sim_time:            false
    loop_rate:               20
    stop_on_failure:         false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin:                 "nav2_waypoint_follower::WaitAtWaypoint"
      enabled:                True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time:         false
    smoothing_frequency:  20.0
    scale_velocities:     False
    feedback:             "OPEN_LOOP"
    max_velocity:         [0.30, 0.20, 0.3]   
    min_velocity:         [-0.30, -0.20, -0.3]  
    max_accel:            [0.30, 0.20, 0.2]   
    max_decel:            [-0.20, -0.20, -0.2]  
    odom_topic:           "odom"
    odom_duration:        0.1
    deadband_velocity:    [0.0, 0.0, 0.0]
    velocity_timeout:     1.0

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 1.0 
    source_timeout: 5.0
    stop_pub_timeout: 2.0
    polygons: ["dummy_box"]
    dummy_box:
      type: "polygon"
      points: "[[0.01, 0.01], [0.01, -0.01], [-0.01, -0.01], [-0.01, 0.01]]"
      action_type: "stop"
      min_points: 4
      visualize: false
      polygon_pub_topic: "polygon_stop"
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      
docking_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 50.0
    dock_plugins: ['simple_dock']
    simple_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.5
      staging_yaw_offset: 0.0