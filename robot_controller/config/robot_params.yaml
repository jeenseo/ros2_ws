# ═══════════════════════════════════════════════════════════════════════════
# robot_params.yaml — 확정 물리 스펙 반영 (2026-08-19)
# ═══════════════════════════════════════════════════════════════════════════
#
#   [확정된 물리 스펙 — 사용자 실측 + 모터 라벨]
#     바퀴 지름      120 mm  (0.12 m)      ← 줄자 실측
#     바퀴 폭         50 mm
#     윤거(Track)    510 mm  (0.51 m)      ← 줄자 실측
#     모터           GP36E13CPR, YFROBOT, 감속비 1:27   ← 라벨 사진
#     엔코더 CPR    1404 = 13 × 27 × 4(TI12 모드)
#     최대 RPM       150 (펌웨어 MOTOR_MAX_RPM)
#
# ★ YAML 함정 2가지
#   1) 노드 이름이 틀리면 **에러 없이 조용히 무시**됩니다. 적용 후 반드시
#      `ros2 param get /motor_node encoder_scale_left` 로 확인하십시오.
#   2) 지수 표기는 `1.0e-9` 형태로. `1e-9` 는 YAML 1.1 에서 문자열로 파싱됩니다.
# ═══════════════════════════════════════════════════════════════════════════

/motor_node:
  ros__parameters:

    # ── 확정 물리 상수 (라벨/실측/URDF 그대로) ────────────────────────
    encoder_cpr:    2745      # ★ encoder_probe 실측 확정
    wheel_diameter: 0.123     # ★ 줄자 실측 12.3 cm

    # ══════════════════════════════════════════════════════════════════
    # ★ max_wheel_speed — 명령 스케일 (encoder_scale 과 짝을 이루는 반대편)
    # ══════════════════════════════════════════════════════════════════
    #   encoder_scale 은 '읽는 쪽(오도메트리)' 을 고칩니다.
    #   max_wheel_speed 는 '쓰는 쪽(명령)' 을 고칩니다.
    #   펌웨어를 안 건드리는 이상 **둘 다 필요합니다.**
    #
    #   0.95 = 이론값(150 RPM x pi x 0.12). 그런데 펌웨어 속도 PID 가
    #   ENCODER_CPR 1404 로 RPM 을 계산하는데 실제는 약 2654 이므로,
    #   목표의 약 53% 지점에서 "달성"으로 판단하고 멈춥니다.
    #
    #   [1차]  f = 0.658 @ v=0.189  ->  0.95 x 0.658 = 0.6251
    #   [2차]  M=0.6251 로 v=0.30 재검증 -> 실제/명령 = 1.059 (105.9%)
    #          ★ M_new = 0.6251 x 1.059 = 0.6620   ← **곱하기**
    #
    #   [부호 주의 — 나누기가 아닙니다]
    #     로봇이 명령보다 '빠르다' = CAN 9999 가 생각보다 큰 속도를 낸다
    #     = M(=CAN 9999 의 실제 속도) 을 **올려야** 같은 속도를 더 작은 CAN 으로
    #       요구하게 되어 느려집니다.
    #     0.6251/1.059=0.5903 을 넣으면 112% 로 오히려 더 빨라집니다.
    #
    #   [속도 의존성 — 상수 하나로 전 구간은 못 맞춤]
    #     K(0.189)=0.6251, K(0.300)=0.6620  (+5.9%, 정지마찰 영향 감소)
    #     M=0.6620 채택 시 v=0.30 에서 100%, v=0.189 에서 94.4%.
    #     Nav2 운용속도(0.20~0.30)를 맞추는 것이 옳고, 저속에서 느린 것은
    #     안전한 방향입니다.
    #   ※ 기계적 상한 146 RPM x pi x 0.12 = 0.917 m/s. 이보다 크게 넣지 마십시오.
    #   ※ 이 값이 CAN 9999 에 해당하므로, 명령 가능한 최대 속도 = 0.6251 m/s,
    #     최대 요레이트 = 0.6251 / 0.505 = 1.238 rad/s 입니다.
    max_wheel_speed: 0.6620

    # ══════════════════════════════════════════════════════════════════
    # ★ encoder_scale — 이 값이 왜 1.0 이 아닌가
    # ══════════════════════════════════════════════════════════════════
    #   ★★ 정체불명이던 0.5290 이 사라졌습니다.
    #
    #   [예전]  CPR 1404 + 지름 120mm  ->  이론 3724 ticks/m
    #           실측 7049 ticks/m 과 1.893배 차이 -> scale 0.5290 으로 억지 보정
    #           "왜 그런지 모르지만 이 비율이 맞다" 상태였습니다.
    #
    #   [지금]  CPR 2745(실측) + 지름 123mm(실측)  ->  이론 7103 ticks/m
    #           실측 7049 ticks/m 과 **0.8% 차이**
    #           scale = 1/(7049.4 x 1.40792e-4) = 1.0076
    #
    #   즉 남은 0.8% 만이 진짜 메카넘 슬립입니다. 나머지는 상수 오류였습니다.
    #
    #   ※ 좌우를 같은 값으로 둡니다.
    #     encoder_probe 의 좌우 편차 3% 는 **재현되지 않았습니다.**
    #       1차: FL/FR = 1.0321  (FL 이 3.2% 큼)
    #       2차: FL/FR = 0.9720  (FL 이 2.8% 작음)   <- 부호가 반대
    #     실제 하드웨어 편차라면 두 번 다 같은 방향이어야 합니다.
    #     손으로 10바퀴 돌릴 때 0.3바퀴 오차면 3% 가 나옵니다. 측정 오차입니다.
    #     좌우를 제대로 분리하려면 아래 방법을 쓰십시오:
    #       로봇을 **손으로 밀어** 직선 2 m 이동 -> FL/FR 틱 비교
    #       (직진이므로 두 바퀴의 이동거리가 같습니다. 틱 차이 = 스케일 차이)
    encoder_scale_left:  1.0076
    encoder_scale_right: 1.0076

    #   ※ 좌우를 같은 값으로 둡니다. 직진 주행만으로는 좌우 분리가 원리적으로
    #     불가능합니다 — 관측식이 (L+R)/2 하나뿐이라 미지수 2개를 못 풉니다.
    #   ※ 좌측 쏠림은 '센싱' 불균형이 아니라 '구동' 불균형이며,
    #     요레이트 보상기가 이미 21배 줄였습니다(κ 0.188 → 0.0091 rad/m).
    #     구동 결함을 엔코더 스케일로 가리면 오도메트리만 망가집니다.

    # ── 슬립 모델 (속도 의존성이 없으므로 비활성) ─────────────────────
    #   ratio = 0.51620 + 0.02749·v, 전 구간 변화폭 1.96% < 측정오차 2σ
    slip_offset:      0.0
    slip_speed_coeff: 0.0

    encoder_scale_y:   1.0
    encoder_scale_yaw: 1.0

    # ══════════════════════════════════════════════════════════════════
    # ★ 요레이트 보상기 — v8 재튜닝 (Kp/Ki 4.0 -> 2.0, LPF 2 Hz 신규)
    # ══════════════════════════════════════════════════════════════════
    #   [왜 4.0 이 갑자기 발진했는가]
    #     4.0 은 mpu6050 publish_hz 가 20.9~35.2 Hz 이던 시절에 잡은 값입니다.
    #     그때는 DLPF 20 Hz > fs/2 라 **안티앨리어싱 조건을 위반**하고 있었고,
    #     고주파 진동이 접혀 들어와 '느린 드리프트처럼' 뭉개져 있었습니다.
    #     즉 Kp=4.0 은 **거짓말하는 센서에 맞춰 튜닝된 값**이었습니다.
    #     publish_hz 를 50 으로 올려 앨리어싱을 없애자 자이로가 메카넘 롤러의
    #     실제 요 진동을 정직하게 보고하기 시작했고, Kp 가 그것을 그대로
    #     바퀴 명령으로 증폭했습니다. 센서를 고치니 튜닝이 무효가 된 것입니다.
    #
    #   [시뮬레이션 근거]  sigma_gyro=0.030 rad/s (주행 중진동) 기준
    #     제어주기당 바퀴 명령 변화량 [CAN 단위, 300↑="툭" 600↑="탁!"]
    #       Kp=4.0 LPF없음 -> 2824   ← 현재 증상
    #       Kp=2.0 LPF없음 -> 1421
    #       Kp=2.0 LPF 3Hz ->  344
    #       Kp=2.0 LPF 2Hz ->  237   ← ★채택
    #     전송지연(단일송신자 도입분)은 30 ms 까지 넣어도 발진 없음 -> 무관.
    #
    #   [LPF 가 옳은 도구인 이유]
    #     상쇄 대상 외란(곡률 드리프트)은 실측 0.0376 rad/s 의 **일정한 DC** 이고
    #     잡음은 수 Hz 이상입니다. 주파수축에서 완전히 분리돼 있어 2 Hz 차단으로
    #     외란 제거 능력은 거의 잃지 않고 잡음만 지웁니다.
    #     (Kp=6 까지도 LPF 로 인한 발진 없음 = 위상 대가 미미)
    #   ══════════════════════════════════════════════════════════════
    #   ★★ [v9 재튜닝] Kp/Ki 2.0 -> 1.3,  LPF 1.5 -> 1.0
    #   ══════════════════════════════════════════════════════════════
    #   [왜 또 바뀌었는가 — max_wheel_speed 와 루프이득이 물려 있습니다]
    #     보상기 출력 comp[rad/s] -> 바퀴차속 comp x L -> /M -> x9999 -> CAN
    #     즉 CAN 차이 = comp x 0.505 / M x 9999.  **루프이득이 1/M 에 비례합니다.**
    #     펌웨어의 CAN->물리 변환은 그대로이므로:
    #         M      comp 1rad/s 당 CAN    0.95 대비    Kp=2.0 의 등가 Kp
    #        0.95           5315            1.00x            2.00   (튜닝 당시)
    #        0.6251         8078            1.52x            3.04   (재발 시점)
    #        0.6620         7628            1.44x            2.87
    #     Kp=2.0 은 M=0.95 에서 검증한 값입니다. M 을 내리는 순간 실효 Kp 가
    #     3.04 상당이 되어, 잡았던 진동이 그대로 재발했습니다.
    #     같은 말: 회전 전달률 G 가 0.67 -> 1.00 으로 올라간 것입니다(명령이 정직해짐).
    #     -> Kp 2.0 / 1.52 = 1.32.  1.3 채택.
    #
    #   [시뮬레이션 근거]  v=0.30, M=0.6620, G=1.0, 제어주기당 바퀴명령 변화 [CAN]
    #     (300↑="툭"  600↑="탁!")           σ=0.03  0.045  0.06  0.08
    #       Kp=2.0 LPF1.5 (현재, 진동 재발)     288    411   549   732
    #       Kp=1.3 LPF1.5                      181    259   346   462
    #       Kp=1.3 LPF1.0  ★채택               144    174   232   310
    #     외란 제거는 유지: v=0.30 에서 개루프 48.5° -> 3.96° (12배 개선)
    #     안정성 여유: 잡음 OFF 기준 Kp=6 까지도 발진 없음
    #
    #   ※ 앞으로 max_wheel_speed 를 바꿀 때마다 kp/ki 를 같은 비율로 나누십시오.
    #     (motor_node 가 param set 시 경고와 함께 계산값을 찍어 줍니다)
    #     단 M 이 이제 정확하므로 앞으로는 ±5% 수준의 미세조정뿐이고,
    #     그 정도는 이득에 ±5% 영향이라 재튜닝이 필요 없습니다.
    yaw_comp_enable:   true
    yaw_comp_kp:       1.3
    yaw_comp_ki:       1.3
    yaw_comp_lpf_hz:   1.0
    yaw_comp_limit:    0.35
    yaw_comp_deadband: 0.005    # 0.01 로 올리면 드리프트가 3배 악화됨. 건드리지 마십시오.

    # ── IMU ───────────────────────────────────────────────────────────
    #   ★ 반드시 바이어스 보정본. /imu/data 는 gz 에 +0.7035 °/s 상수 바이어스.
    imu_topic:        /imu/data_unbiased
    imu_timeout:      0.35      # 실측 주기 20.9~35.2 Hz 로 흔들려 0.20 은 빠듯
    use_gyro_for_yaw: true

    # ── 프레임 / 토픽 ─────────────────────────────────────────────────
    odom_topic:      /odom_motor
    odom_frame:      odom
    base_frame:      base_footprint     # ekf.yaml / URDF 루트와 일치

    # ── CAN ───────────────────────────────────────────────────────────
    can_channel: can0
    can_tx_hz:   50.0
    cmd_timeout: 0.5

    covariance_model: linear


/imu_gyro_bias_node:
  ros__parameters:
    input_topic:  /imu/data
    output_topic: /imu/data_unbiased
    # 분산 기반 정지 판정(v3). 실측 gyro_var 1.64e-5 -> 임계 5.0e-5 는 여유 3.05배.
    still_gyro_var:    5.0e-5
    still_gyro_thresh: 0.15
    still_accel_band:  1.5
    still_accel_var:   0.05
    window_sec:        0.5
    still_hold_sec:    1.0
    bias_tau:          20.0
    warmup_sec:        3.0
    output_gyro_z_variance:  4.0e-4
    output_gyro_xy_variance: 4.0e-4


/mpu6050_node:
  ros__parameters:
    i2c_bus:    0
    # ★ [수정] 'i2c_addr' 가 아니라 'i2c_address' 입니다.
    #   ROS2 는 선언되지 않은 파라미터를 YAML 로 줘도 에러 없이 무시하므로,
    #   지금까지 이 값은 한 번도 적용된 적이 없습니다(기본값 0x68 로 우연히 동작).
    i2c_address: 0x68
    frame_id:   imu_link          # URDF 의 imu_link 와 일치
    publish_hz: 50.0
    # ★ 안티앨리어싱: DLPF 대역 < publish_hz/2 여야 합니다.
    #   현재 DLPF 20 Hz, 실측 발행 20.9~35.2 Hz -> Nyquist 10.5~17.6 Hz.
    #   고속 주행 시 진동이 접혀 들어옵니다(PWM6000 에서 odom Δyaw 가 실제의 2배).
    #   publish_hz 를 50 으로 올려 20 Hz DLPF 와 정합시킵니다.
    dlpf_cfg:    4       # 20 Hz
    smplrt_div:  4


/rf2o_covariance_relay:
  ros__parameters:
    input_topic:  /odom_rf2o
    output_topic: /odom_rf2o_cov
    # ══════════════════════════════════════════════════════════════════
    # ★ 라이다 퇴화 부스트 — 이 지도에서 반드시 켜야 합니다
    # ══════════════════════════════════════════════════════════════════
    #   [수정] 'degeneracy_enable' 이 아니라 'enable_degeneracy_boost' 입니다.
    #          틀린 이름은 에러 없이 무시되므로 지금까지 미적용 상태였습니다.
    #
    #   [왜 지금 켜는가]  capstone_map 은 약 72 m x 2 m, 종횡비 36:1 복도입니다.
    #   측벽은 1 m 앞에 있어 Y/Yaw 는 잘 구속되지만, 복도 끝은 라이다 최대거리
    #   (12 m) 밖이라 **X 방향 특징이 존재하지 않습니다.** rf2o 는 전진 변위를
    #   찾지 못해 vx ~ 0 을 연속 출력합니다(초기 실측의 '라이다 2.5m 에서 멈춤').
    #   그 값을 EKF 가 믿으면 로봇이 실제로는 전진 중인데 제자리라고 판단합니다.
    #
    #   훅 동작: |vx| < eps 이고 |wz| < 0.15 인 프레임이 count 회 연속되면
    #            var_vx 를 gain 배 팽창 -> EKF 가 rf2o 의 X 를 사실상 무시하고
    #            엔코더(검증 오차 1.3%)에 맡깁니다. Y/Yaw 는 계속 라이다를 신뢰.
    enable_degeneracy_boost: true
    degeneracy_stall_eps:    0.005    # [m/s] 이보다 작으면 '스톨'
    degeneracy_stall_count:  3        # 연속 프레임 수
    degeneracy_gain:         25.0     # var_vx 배율 (0.060 -> 1.5 = 사실상 무시)
    sigma_vx:  0.245
    sigma_vy:  0.05
    sigma_wz:  0.06


/cruise_node:
  ros__parameters:
    # ★ 이전 테스트에서 'IMU 누적'이 실제보다 0.82~0.87 °/s 크게 나온 원인.
    #   이 값이 정지 시 측정한 바이어스 0.7035 °/s 와 거의 같았습니다.
    imu_topic:  /imu/data_unbiased
    odom_topic: /odom_motor
    cmd_topic:  /cmd_vel_keyboard
    rate_hz:    50.0


/keyboard_node:
  ros__parameters:
    adaptive_grace: false     # 즉시정지 모드
    key_grace:      0.05
    publish_hz:     50.0
    input_watchdog: 0.5