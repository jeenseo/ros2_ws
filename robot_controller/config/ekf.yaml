# ekf.yaml  —  Stage 1 : Baseline Stabilization (정적 R/Q 튜닝)
# ============================================================================
# robot_localization EKF 설정 / 메카넘 4륜 + 2D LiDAR(rf2o) + MPU6050
#
# 상태 벡터(15): [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
#
# ╔══════════════════════════════════════════════════════════════════════════╗
# ║ ★ 이번 버전의 가장 중요한 구조 변경 : rf2o를 '위치'가 아닌 '속도'로 융합 ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#   [문제] 기존 설정은 odom0(rf2o)의 절대 위치(X,Y,Yaw)를 융합했습니다.
#          절대 위치 측정값은 R을 아무리 크게 키워도 '편향(bias)'이 있으면
#          혁신(innovation)이 항상 같은 방향을 가리키므로 시간이 지날수록
#          반드시 EKF를 지배합니다. 추측항법(적분) 항은 절대 이길 수 없습니다.
#            => Foxglove에서 EKF_Odom(파랑)이 LiDAR_Only(2.5m)에 달라붙은 원인.
#            => "X축 R을 대폭 키운다"는 처방이 근본적으로 작동하지 않는 이유.
#
#   [해결] rf2o는 본래 스캔 정합으로 '변위'를 재는 센서이고, 그 pose는 적분값입니다.
#          속도(twist)로 융합하면 엔코더 속도와 같은 공간에서 경쟁하게 되어
#          R 비율이 곧 가중치가 됩니다. 그제서야 "X는 불신, Y/Yaw는 신뢰"가
#          수치적으로 의미를 가집니다.
#
#   [전제] rf2o는 covariance를 채워주지 않고, robot_localization에는 R 오버라이드
#          파라미터가 없습니다. 반드시 rf2o_covariance_relay.py 를 launch에 추가하고
#          odom0를 /odom_rf2o_cov 로 지정해야 아래 R 튜닝이 실제로 적용됩니다.
#
# ── 센서별 역할 분담 (실측 데이터 기반) ─────────────────────────────────────
#   축      | 직진(복도)                      | 회전 포함
#   --------+---------------------------------+-------------------------------
#   X (전진)| 엔코더(스케일 보정 후) 주도     | rf2o 주도 (엔코더는 동적으로 폐기)
#   Y (횡)  | rf2o 전담 (벽면 구속 양호)      | rf2o 전담
#   Yaw     | IMU 자이로 주도 + rf2o가 장기 드리프트 보정
#   => 어느 순간에도 '그 순간 정확한 센서'가 주도하도록 R을 배치했습니다.
#
# ╔══════════════════════════════════════════════════════════════════════════╗
# ║ ★ Stage 1b 변경 : RL(좌후륜) 부상 + 전륜 2개만 엔코더                    ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#   [관측성 분석] 메카넘 요레이트는 4륜 전체에서만 복원됩니다.
#       wz = (r / (4(lx+ly))) * (-w_fl + w_fr - w_rl + w_rr)
#     전륜 2채널만으로는 이 식의 절반이 비어 있어 어떤 계수로도 복원 불가 = 랭크 결손.
#     게다가 메카넘 롤러는 측면 미끄러짐을 허용하므로, 차체가 회전해도 전륜 엔코더는
#     얼마든지 동일한 값을 낼 수 있습니다.
#     => "모터 Wz 의 R 을 얼마로 줄까"는 질문 자체가 성립하지 않습니다.
#        관측 불가능한 양은 R 을 무한대로 줘도 정보가 0 이고, 유한하게 주면 오염원입니다.
#        정답은 **융합 대상에서 제외**이며, Stage 1의 odom1_config 가 이미 그렇게 되어
#        있었던 것이 결과적으로 이 결함을 막아준 셈입니다. 이번에도 유지합니다.
#
#   [Vy 도 같은 논리로 제외] RL 부상으로 직진 명령(cmd_vy=0) 중에도 차체는 실제로
#     옆으로 밀립니다. motor_node 의 Vy 는 '명령 적분값'이라 이때 0 이라고 우깁니다.
#     즉 노이즈가 큰 것이 아니라 상시 거짓말입니다. rf2o Vy 는 복도 벽면으로 잘 구속되어
#     이 횡방향 밀림을 실제로 관측할 수 있는 유일한 소스이므로 Vy 는 rf2o 에 전담시킵니다.
#     => odom1 은 '전진 롤링 거리' 딱 하나만 EKF 에 기여합니다. 정직하게 잴 수 있는 유일한 양.
#
#   [Yaw 신뢰도 재배분] IMU 가 유일한 고주파 요 소스가 되었으므로, 이제 IMU 의
#     **노이즈가 아니라 바이어스**가 지배 오차입니다. imu0 R 을 1e-5 -> 4e-4 로 현실화하고
#     rf2o sigma_wz 를 0.10 -> 0.06 으로 조여 라이다가 장기 드리프트를 잡게 했습니다.
#     추가로 imu_gyro_bias_node.py 로 정지 중 바이어스를 추정해 제거합니다.
#     (편향은 R 로 못 없앤다 — Stage 1 과 동일한 원칙)
#
# ╔══════════════════════════════════════════════════════════════════════════╗
# ║ ★ Stage 1c : STM32 펌웨어(motor.c) 실물 분석으로 확정된 사실             ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#   [1] 엔코더 Vx 는 기하학적으로 '정확하다' — 그래서 odom1 에 남길 가치가 있다
#       엔코더가 FL/FR 전륜에만 있으므로 메카넘 IK 를 대입하면
#           FL = Vx − Vy − Wz·l ,  FR = Vx + Vy + Wz·l
#           (FL + FR)/2 = Vx            <- Vy 와 Wz 가 완전히 소거된다 (오차항 없음)
#       즉 전륜 2채널은 Vx 만큼은 '구조적으로 옳게' 측정합니다. 남은 문제는 슬립(스케일)뿐이고,
#       그것은 캘리브레이션으로 제거 가능합니다. odom1 에 Vx 만 남긴 것이 정답인 이유.
#
#   [2] 반면 엔코더 요는 Vy 로 오염된다 — 그래서 절대 넣으면 안 된다
#           (FR − FL)/(2l) = Wz + Vy/l  ,  1/l = 1.98 rad/s per m/s
#       게걸음 0.2 m/s 만 해도 0.396 rad/s 의 가짜 요레이트가 발생합니다.
#       (motor.c 주석은 "좌측 엔코더 = (FL+RL)/2 라서 Vy 소거"를 전제하지만,
#        실제 엔코더는 FL 하나뿐이므로 그 전제가 성립하지 않습니다.)
#       => odom1 Vyaw = false 는 관측성 결손 + 이 오염, 두 가지 이유로 확정입니다.
#
#   [3] PID 가 사실상 무력해 슬립이 속도에 비례한다
#       MOTOR_KP=2.0 vs Zone2 FF 기울기 67.7 PWM/RPM => P 항 권한이 약 1/34.
#       실질 개루프이므로 부하가 걸리면 목표 RPM 에 못 미치고, 토크 요구가 클수록 슬립↑.
#       실측:  바퀴 0.377 m/s -> 엔코더/실제 1.355 | 0.754 m/s -> 1.700
#              회귀 slip(v) = 0.0105 + 0.9144·v  (거의 정비례)
#       => 단일 정적 스케일로 2배 속도 범위를 커버하면 최대 25% 거리 오차.
#          motor_node 의 slip_speed_coeff 를 쓰거나, 운용 속도를 고정하십시오.
#
#   [4] mpu6050_node.py 에 자이로 바이어스 보정이 전혀 없다
#       gz = raw/131.0*DEG_TO_RAD 로 끝. 출고 바이어스 1~3 °/s => 20초에 20~60° 오차.
#       imu0 를 /imu/data_unbiased 로 돌린 것이 선택이 아니라 필수인 이유입니다.
#       추가로 publish_hz=20 은 요레이트 적분 소스로 낮습니다(1.5 rad/s 에서 4.3°/샘플).
#       mpu6050_node.py 의 publish_hz 를 50~100 으로 올리길 권합니다.
#
# TF 발행 규칙: ekf_node만 odom -> base_footprint 발행. motor_node, rf2o는 금지.
# ============================================================================

ekf_node:
  ros__parameters:

    # ── 기본 설정 ────────────────────────────────────────────────────────
    frequency:             30.0
    sensor_timeout:        0.4     # 회전 중 rf2o 순간 실패 허용 (Dead-Reckoning 폴백)
    two_d_mode:            true
    transform_time_offset: 0.0
    transform_timeout:     0.0
    print_diagnostics:     true
    debug:                 false
    publish_tf:            true

    # [추가] 현재 시각까지 예측해서 출력 -> Nav2 제어 지연 감소
    predict_to_current_time: true

    # [추가] 늦게 도착한 측정값을 히스토리에 되돌려 반영.
    #        rf2o는 스캔 처리 지연이 있어 타임스탬프가 과거인 경우가 많습니다.
    #        CPU 여유가 없으면 false로 두십시오.
    smooth_lagged_data: true
    history_length:     0.2

    # [추가/중요] 속도에 비례해 Q를 스케일링. 정지 중 공분산 폭주와 드리프트를 억제하며
    #             motor_node의 ZUPT와 시너지를 냅니다.
    dynamic_process_noise_covariance: true

    # ── 프레임 ───────────────────────────────────────────────────────────
    map_frame:       map
    odom_frame:      odom
    base_link_frame: base_footprint
    world_frame:     odom

    # ═════════════════════════════════════════════════════════════════════
    # odom0 : LiDAR 오도메트리 (rf2o_covariance_relay.py 출력)
    #         ※ 원본 /odom_rf2o 가 아니라 릴레이 출력 토픽입니다!
    # ═════════════════════════════════════════════════════════════════════
    odom0: /odom_rf2o_cov

    # [x,     y,      z,
    #  roll,  pitch,  yaw,
    #  vx,    vy,     vz,
    #  vroll, vpitch, vyaw,
    #  ax,    ay,     az]
    #
    # ★ pose(X,Y,Yaw)를 전부 false로 내렸습니다. 위 헤더의 '구조 변경' 참조.
    #   대신 Vx / Vy / Vyaw 를 활성화하여 엔코더와 같은 속도 공간에서 경쟁시킵니다.
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,   # Vx, Vy  ← 릴레이가 body-frame으로 계산해 줌
                   false, false, true,    # Vyaw
                   false, false, false]

    odom0_queue_size:   10
    odom0_nodelay:      true
    # pose를 융합하지 않으므로 아래 두 플래그는 무의미해집니다(둘 다 pose 전용).
    # 혼란 방지를 위해 명시적으로 false.
    odom0_differential: false
    odom0_relative:     false
    # 스캔매칭 발산 프레임 방어 (마할라노비스 거리). 릴레이의 하드 아웃라이어 컷과 2중 방어.
    odom0_twist_rejection_threshold: 5.0

    # ── odom0의 R 값은 rf2o_covariance_relay.py 파라미터로 주입됩니다 ──────
    #     sigma_vx = 0.245  -> var 0.060   ← X 대폭 불신 (복도 퇴화, 50% 과소 추정)
    #     sigma_vy = 0.050  -> var 0.0025  ← Y 전담 (벽면 구속 양호). X 대비 24배 신뢰
    #     sigma_wz = 0.060  -> var 0.0036  ← [Stage 1b] 0.10에서 하향
    #
    #   ★ sigma_wz 를 조인 이유: 자이로 바이어스에 대한 '장기 권한' 확보
    #     두 각속도 소스의 정상상태 가중치는 w_imu = R_rf2o / (R_imu + R_rf2o) 입니다.
    #       (기존) R_imu 1e-5, R_rf2o 1e-2  -> w_imu = 0.999  : 라이다 권한 0.1%
    #              자이로가 0.01 rad/s 로 드리프트해도 EKF 가 그대로 믿어버림
    #       (현재) R_imu 4e-4, R_rf2o 3.6e-3 -> w_imu = 0.900 : 라이다 권한 10%
    #              단기 회전은 여전히 IMU 가 지배(90%)하면서, 정적 벽면 대비 스캔정합인
    #              rf2o 가 누적 방위 드리프트를 지속적으로 끌어당김
    #     rf2o Vyaw 는 정지 벽면 기준이라 '무편향(bias-free)' 이라는 점이 핵심입니다.

    # ═════════════════════════════════════════════════════════════════════
    # imu0 : MPU6050 (/imu/data) — 회전 추적 1차 소스
    # ═════════════════════════════════════════════════════════════════════
    # ★ [Stage 1b] 원본 /imu/data 가 아니라 바이어스 보정 노드의 출력입니다!
    #   IMU 가 유일한 고주파 요 소스가 된 이상, 바이어스 미보정은 곧 방위 발산입니다.
    #   0.01 rad/s 바이어스 = 60초 후 34도의 가짜 회전.
    imu0: /imu/data_unbiased

    # Wz(각속도)만 사용. 자기계가 없어 절대 Yaw는 신뢰할 수 없으므로 yaw는 false 유지.
    # 선가속도(ax)도 융합하지 않습니다: MPU6050의 바이어스가 적분되어 오히려 발산합니다.
    #   -> IMU 가속도는 EKF가 아니라 motor_node의 슬립 감지 증거로 쓰는 것이 정답입니다.
    #      (Stage 3 퍼지 엔진의 accel_x 입력이 바로 이 경로입니다)
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,    # Vyaw
                  false, false, false]

    imu0_nodelay:                           true
    imu0_differential:                      false
    imu0_relative:                          true
    imu0_queue_size:                        10
    imu0_remove_gravitational_acceleration: true
    imu0_twist_rejection_threshold:         5.0
    # ── R: imu_gyro_bias_node.py 가 주입 (output_gyro_z_variance) ──────────
    #   [변경] 1e-5 (sigma 0.0032 rad/s) -> 4e-4 (sigma 0.02 rad/s)
    #   1e-5 는 데이터시트 백색노이즈 밀도만 반영한 낙관값입니다. MPU6050 의 실제 지배
    #   오차는 온도/시간에 따른 바이어스 불안정도이며, 이는 백색이 아니라 저주파 편향입니다.
    #   R 을 스펙시트 값으로 두면 EKF 가 드리프트하는 자이로를 '거의 완벽한 센서'로
    #   취급해 rf2o 의 교정 기회를 봉쇄합니다.
    #   ※ 이 값을 키우는 것은 자이로를 불신하는 게 아니라, 자이로가 실제로 가진
    #     오차의 '종류'를 정직하게 반영하는 것입니다.

    # ═════════════════════════════════════════════════════════════════════
    # odom1 : 엔코더 휠 오도메트리 (/odom_motor)
    # ═════════════════════════════════════════════════════════════════════
    odom1: /odom_motor

    # ★ [Stage 1b] Vy 를 true -> false 로 내렸습니다. 이제 Vx 단 하나만 융합합니다.
    #
    #   왜 Vy 를 껐는가:
    #     motor_node 의 Vy 는 좌/우 2채널 엔코더로는 측정이 불가능해 'cmd_vy 적분값'입니다.
    #     RL 부상 상태에서는 직진 명령(cmd_vy=0) 중에도 차체가 실제로 옆으로 밀리므로,
    #     이 채널은 "횡이동 0" 이라고 상시 거짓 보고를 합니다.
    #     rf2o Vy 는 복도 벽면으로 잘 구속되어 이 밀림을 실제로 관측하는 유일한 소스인데,
    #     거짓 0 이 계속 끼어들면 그 관측을 희석시킵니다.
    #     (가중치로는 rf2o 가 이기지만, rf2o 가 sensor_timeout 되는 순간 거짓 0 이 100% 권한을
    #      갖게 되는 것이 더 위험합니다)
    #
    #   왜 Vyaw 는 여전히 false 인가:
    #     관측성 결손. 위 헤더의 랭크 결손 분석 참조. R 로 해결되는 문제가 아닙니다.
    #
    #   => 결론: 전륜 2채널 엔코더가 정직하게 잴 수 있는 것은 '전진 롤링 거리' 하나뿐이고,
    #      EKF 에는 그 하나만 넣습니다. 4륜 엔코더가 확보되면 Vy 를 다시 켜십시오.
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  false, false,   # Vx 만
                   false, false, false,   # Vyaw 제외 (관측 불가)
                   false, false, false]

    odom1_queue_size:   10
    odom1_nodelay:      true
    odom1_differential: false
    odom1_relative:     false
    # 엔코더가 가장 못 믿을 소스이므로 게이트를 상대적으로 조입니다.
    # (다만 동적 R이 커지면 마할라노비스 거리가 작아져 잘 걸리지 않습니다 = 스파이크 전용 안전망)
    odom1_twist_rejection_threshold: 3.0

    # ── odom1의 R은 motor_node.py의 LinearCovarianceModel이 실시간 계산 ──────
    #   sigma_vx^2 = 0.02^2 + (0.10*|v|)^2 + (1.00*|w|)^2 + (0.30*r_cmd)^2 + (1.20*r_gyro)^2
    #
    #   [직진 순항 0.5 m/s, 회전 없음]
    #     var_vx ≈ 0.0004 + 0.0025 = 0.0029  (sigma ≈ 0.054)
    #     rf2o의 var 0.060 대비 약 21배 신뢰 -> 직진 X는 엔코더가 주도.
    #     (그래서 encoder_scale_x 캘리브레이션이 필수입니다. 편향이 그대로 결과가 됩니다.)
    #
    #   [회전 포함 주행, |w| ≈ 1.0 rad/s]
    #     var_vx ≈ 0.0029 + 1.00 + (자이로 잔차항) ≈ 1.15  (sigma ≈ 1.07)
    #     rf2o의 var 0.060 대비 약 1/19 가중치 -> 회전 시 X는 rf2o가 주도.
    #     엔코더가 10m로 폭주해도 EKF 기여도는 5% 수준으로 억제됩니다.
    #
    #   ※ 축소 EKF 시뮬레이션(verify_tuning.py) 결과, 위 R/Q 조합에서
    #     직진 5.01m -> EKF 4.97m (-0.7%), 회전 5.01m -> EKF 5.14m (+2.5%).
    #     단, encoder_scale_x 보정이 적용된 경우에 한합니다(무보정 시 6.8m / 6.2m).

    # ═════════════════════════════════════════════════════════════════════
    # pose0 : AprilTag 비전 (/vision_pose)  ★ 이번 단계에서는 비활성화 ★
    # ═════════════════════════════════════════════════════════════════════
    # [비활성화 사유] 이 EKF 인스턴스는 world_frame: odom 입니다.
    #   odom 프레임은 정의상 '연속적이고 점프가 없는' 프레임이어야 합니다.
    #   map 프레임 기준 절대 위치(AprilTag)를 여기에 주입하면 태그를 볼 때마다
    #   odom->base TF가 순간 이동하고, Nav2의 지역 경로계획과 costmap이 무너집니다.
    #   또한 지금은 베이스라인 R/Q를 측정하는 단계라 간헐적 점프 소스가 섞이면
    #   5m 오차 측정 자체가 불가능합니다.
    #
    # [올바른 구조] robot_localization을 2개 인스턴스로 운용하십시오.
    #   ekf_odom (이 파일)        : world_frame=odom, 연속적 추측항법, odom->base_footprint
    #   ekf_map  (별도 yaml)      : world_frame=map,  여기에 pose0(AprilTag) 융합, map->odom
    #   Stage 1 검증이 끝나면 ekf_map.yaml을 따로 만들어 드리겠습니다.
    #
    # pose0: /vision_pose
    # pose0_config: [true, true, false, false, false, true,
    #                false, false, false, false, false, false,
    #                false, false, false]
    # pose0_queue_size: 5
    # pose0_differential: false
    # pose0_relative: false

    # ═════════════════════════════════════════════════════════════════════
    # 프로세스 노이즈 공분산 Q (15x15 대각)
    # 순서: x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az
    # ═════════════════════════════════════════════════════════════════════
    # ▣ Q 튜닝 철학 (측정값이 모두 불안정할 때의 추측항법 안정성 확보)
    #   Q는 "모델을 얼마나 못 믿는가"입니다. Q가 크면 P가 빨리 커지고 칼만 이득
    #   K = P H^T (H P H^T + R)^-1 가 커져 측정값을 빨리 따라갑니다.
    #
    #   1) Q_x, Q_y : 0.05 -> 0.03 (↓)
    #      이제 위치는 '융합된 속도의 순수 적분'입니다. 위치에 인위적 노이즈를 주입하면
    #      P_x 성장이 속도 불확실성 전파가 아닌 임의 상수에 지배되어, Nav2/AMCL이
    #      읽는 불확실성이 물리적 의미를 잃습니다. 정보의 출처를 속도 쪽에 몰아줍니다.
    #
    #   2) Q_vx, Q_vy : 0.025 -> 0.05 (↑)
    #      메카넘은 1 m/s^2 이상으로 급가감속합니다. Q_v가 작으면 필터가 실제 가속을
    #      못 따라가고, 그 지연을 '측정 오차'로 오인해 엉뚱하게 신뢰도를 재배분합니다.
    #      또한 동적 R이 순간 팽창(회전 진입)할 때 필터가 빠르게 rf2o로 갈아탈 수
    #      있게 해주는 것이 Q_v입니다. R을 키우는 것과 반드시 짝을 이뤄야 합니다.
    #
    #   3) Q_yaw : 0.05 -> 0.02 (↓), Q_vyaw : 0.02 -> 0.06 (↑)
    #      Yaw 절대값을 재는 센서가 없으므로 Yaw는 자이로 적분입니다. Q_yaw를 키우면
    #      적분 결과만 흐려집니다. 대신 Q_vyaw를 키워 자이로(R이 1e-5로 극히 작음)를
    #      즉각 추종하게 합니다. 회전 시 Yaw 추정이 늦으면 X/Y 분해가 통째로 틀어집니다.
    #
    #   4) 미사용 축(z, roll, pitch, vz, vroll, vpitch, a*) : 0.01로 통일
    #      two_d_mode에서 억제되지만 0으로 두면 수치적으로 특이(singular)해질 수 있어
    #      작은 양수를 유지합니다.
